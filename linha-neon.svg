<svg xmlns="http://www.w3.org/2000/svg" width="900" height="14" viewBox="0 0 900 14" role="img" aria-label="Linha neon azul e magenta animada">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#278BFF"/><stop offset=".5" stop-color="#D946EF"/><stop offset="1" stop-color="#278BFF"/></linearGradient><linearGradient id="s"><stop stop-color="#278BFF" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#D946EF" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="6" width="900" height="2" rx="1" fill="url(#g)" opacity=".75"/>
<rect x="-170" y="4" width="170" height="6" rx="3" fill="url(#s)" opacity=".9"><animate attributeName="x" from="-170" to="900" dur="5s" repeatCount="indefinite"/></rect>
</svg>